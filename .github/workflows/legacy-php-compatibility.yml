name: Ad Infinitum - diagnóstico PHP legado (sin ejecutar)
on:
  pull_request:
    paths:
      - '**/*.php'
      - '.htaccess'
      - 'tools/check_legacy_guardrails.py'
      - '.github/workflows/legacy-php-compatibility.yml'
      - 'docs/php-compatibility-audit.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    name: PHP ${{ matrix.php }} - sintaxis de todo el archivo
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2','8.3','8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Comprobar sintaxis de PHP sin ejecutar la aplicación
        shell: bash
        run: |
          set -euo pipefail
          count=0
          failed=0
          while IFS= read -r -d '' file; do
            count=$((count+1))
            if ! php -d display_errors=0 -l "$file" >/dev/null 2>&1; then
              echo "::error file=$file::No supera el análisis de sintaxis PHP"
              failed=$((failed+1))
            fi
          done < <(find . -type f -name '*.php' -print0)
          echo "PHP archivos comprobados: $count; fallos: $failed"
          test "$count" -ge 130
          test "$failed" -eq 0
  guardrails:
    name: Comprobar barreras de exposición básicas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_legacy_guardrails.py
