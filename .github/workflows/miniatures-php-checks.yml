name: Ad Infinitum - regresión de Miniaturas
on:
  pull_request:
    paths:
      - 'content/sections/miniatures.php'
      - 'content/sections/miniatures_admin.php'
      - 'content/miniatures_admin_lib.php'
      - 'tools/setup_miniatures_admin.php'
      - 'tools/check_miniatures_access.php'
      - 'tools/test_miniatures_admin.php'
      - '.htaccess'
      - 'index.php'
      - 'media/figurine/**'
      - 'tools/test_miniatures.py'
      - 'tools/test_miniatures_runtime.php'
      - 'tools/check_miniatures_preflight.php'
      - '.github/workflows/miniatures-php-checks.yml'
  push:
    branches: [main]
    paths:
      - 'content/sections/miniatures.php'
      - 'content/sections/miniatures_admin.php'
      - 'content/miniatures_admin_lib.php'
      - 'tools/setup_miniatures_admin.php'
      - 'tools/check_miniatures_access.php'
      - 'tools/test_miniatures_admin.php'
      - '.htaccess'
      - 'index.php'
      - 'media/figurine/**'
      - 'tools/test_miniatures.py'
      - 'tools/test_miniatures_runtime.php'
      - 'tools/check_miniatures_preflight.php'
      - '.github/workflows/miniatures-php-checks.yml'
permissions:
  contents: read
jobs:
  miniatures:
    name: Miniaturas con PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Sintaxis PHP
        run: php -l content/sections/miniatures.php && php -l tools/test_miniatures_runtime.php && php -l tools/check_miniatures_preflight.php && php -l content/sections/miniatures_admin.php && php -l content/miniatures_admin_lib.php && php -l tools/setup_miniatures_admin.php && php -l tools/check_miniatures_access.php && php -l tools/test_miniatures_admin.php
      - name: Ejecutar rutas reales con MySQL simulado
        run: php tools/test_miniatures_runtime.php
      - name: Validar acceso privado y formularios
        run: php tools/test_miniatures_admin.php
      - name: Comprobar alias de imágenes y condiciones de seguridad
        run: python3 tools/test_miniatures.py
